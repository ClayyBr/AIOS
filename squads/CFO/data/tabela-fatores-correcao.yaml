# =============================================================================
# TABELA DE FATORES DE CORREÇÃO (FC) E COCÇÃO (FCc)
# Base de Dados para Restaurantes Brasileiros
# =============================================================================
#
# Fontes: EMBRAPA, IBGE (Tabela TACO), Sebrae, literatura técnica gastronômica
#
# FC (Fator de Correção): PB ÷ PL (Peso Bruto ÷ Peso Líquido)
#   - FC = 1.00 significa zero perda
#   - FC = 1.50 significa 33% de perda (compra 1.5kg para obter 1kg limpo)
#   - Quanto MAIOR o FC, MAIOR a perda
#
# FCc (Fator de Cocção): Peso Cru ÷ Peso Cozido
#   - FCc < 1.00 significa que o alimento GANHA peso (ex: arroz absorve água)
#   - FCc > 1.00 significa que o alimento PERDE peso (ex: carne encolhe)
#
# Custo Real por Kg Utilizável = Custo Compra/kg × FC
#
# ATENÇÃO: Estes valores são MÉDIAS. O FC real varia por:
#   - Qualidade do fornecedor
#   - Safra e sazonalidade
#   - Habilidade do manipulador
#   - Equipamento utilizado
# SEMPRE faça seus próprios testes de rendimento!
# =============================================================================

metadata:
  versao: "1.0.0"
  data_atualizacao: "2026-02"
  fontes:
    - "Tabela TACO - UNICAMP"
    - "EMBRAPA - Tabelas de Composição"
    - "Sebrae - Guias de Gestão Gastronômica"
    - "Ornellas, L.H. - Técnica Dietética"
    - "Philippi, S.T. - Tabela de Composição de Alimentos"
  notas:
    - "FC médio. Testar com seu fornecedor específico"
    - "FCc varia por método de cocção (forno, grelha, fritura, vapor)"
    - "Preços são referência Brasil fev/2026, variam por região"

