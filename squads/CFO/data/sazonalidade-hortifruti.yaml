# =============================================================================
# CALENDÁRIO DE SAZONALIDADE DE HORTIFRÚTI — BRASIL
# Referência para Planejamento de Cardápio e Compras
# =============================================================================
#
# Fontes: CEAGESP (São Paulo), EMBRAPA, CONAB, Sebrae
#
# Legenda de disponibilidade/preço:
#   alta    = Alta temporada (produto abundante, PREÇO BAIXO)
#   media   = Disponibilidade moderada (preço intermediário)
#   baixa   = Baixa temporada (produto escasso, PREÇO ALTO)
#   safra   = Pico de safra (melhor momento para comprar)
#   entressafra = Momento de menor oferta (evitar ou substituir)
#
# ESTRATÉGIA: Sempre que possível, montar o cardápio semanal/mensal
# priorizando ingredientes em "alta" ou "safra" e evitando os em "baixa".
# Isso pode reduzir o CMV de hortifrúti em 15-30%.
#
# NOTA: Sazonalidade varia por região. Este calendário é baseado
# principalmente no Sudeste (SP/RJ/MG). Para Nordeste e Sul,
# os meses podem variar em 1-2 meses.
# =============================================================================

metadata:
  versao: "1.0.0"
  data_atualizacao: "2026-02"
  regiao_referencia: "Sudeste (SP/RJ/MG)"
  fontes:
    - "CEAGESP — Calendário de Sazonalidade"
    - "CONAB — Prognóstico Agrícola"
    - "EMBRAPA — Sistemas de Produção"
    - "Sebrae — Guia de Compras para Restaurantes"

# =============================================================================
# HORTALIÇAS — FOLHOSAS
# =============================================================================
folhosas:
  alface:
    nome: "Alface (americana, crespa, lisa)"
    melhor_epoca: "Abril a Outubro"
    pior_epoca: "Dezembro a Fevereiro"
    meses:
      jan: baixa    # Calor reduz qualidade e aumenta preço
      fev: baixa
      mar: media
      abr: alta     # Clima ameno, produção alta
      mai: alta
      jun: safra    # Melhor mês — abundante e barata
      jul: safra
      ago: alta
      set: alta
      out: media
      nov: media
      dez: baixa    # Chuvas e calor prejudicam
    impacto_cmv: "No verão, preço pode dobrar. Substituir por rúcula ou agrião se mais baratos"
    dica_compra: "Comprar 3x/semana. No verão, reduzir variedade de saladas de folha"

