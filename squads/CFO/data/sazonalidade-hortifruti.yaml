# =============================================================================
# GUIA RÁPIDO MENSAL: O QUE COMPRAR E O QUE EVITAR
# =============================================================================
guia_mensal:
  janeiro:
    comprar: ["Manga", "Abacaxi", "Melancia", "Milho verde", "Quiabo", "Cebola"]
    evitar: ["Alface", "Brócolis", "Couve-flor", "Morango"]
    dica_cardapio: "Verão. Saladas mais simples (repolho, tomate cereja). Sucos de frutas da safra. Mais pratos frios"

  fevereiro:
    comprar: ["Limão", "Maracujá", "Berinjela", "Cebola", "Quiabo"]
    evitar: ["Tomate", "Alface", "Brócolis", "Batata", "Morango"]
    dica_cardapio: "Mês mais desafiador para hortifrúti. Carnaval altera padrão de consumo. Cardápio flexível"

  marco:
    comprar: ["Banana", "Abóbora", "Chuchu", "Limão", "Maracujá"]
    evitar: ["Tomate", "Batata", "Cenoura", "Mandioca"]
    dica_cardapio: "Transição verão-outono. Começar a reintroduzir folhosas. Sopas ganham espaço"

  abril:
    comprar: ["Alface", "Banana", "Abóbora", "Couve", "Repolho"]
    evitar: ["Batata", "Cenoura", "Pimentão", "Vagem"]
    dica_cardapio: "Clima ameno. Retorno das saladas de folha. Sopas e caldos"

  maio:
    comprar: ["Alface", "Rúcula", "Espinafre", "Chuchu", "Mandioca", "Banana"]
    evitar: ["Pimentão", "Abobrinha", "Berinjela", "Quiabo"]
    dica_cardapio: "Início do inverno. Pratos quentes, caldos, sopas. Couve na feijoada (safra!)"

  junho:
    comprar: ["Alface", "Rúcula", "Espinafre", "Tomate", "Repolho", "Couve", "Brócolis", "Morango"]
    evitar: ["Cebola", "Abobrinha", "Berinjela", "Quiabo", "Manga"]
    dica_cardapio: "Melhor mês para folhosas e brócolis. Festa junina: canjica, milho (se safra tardia). Morango aparece"

  julho:
    comprar: ["Rúcula", "Espinafre", "Tomate", "Brócolis", "Couve-flor", "Cenoura", "Laranja", "Morango"]
    evitar: ["Cebola", "Abobrinha", "Quiabo", "Manga", "Melancia"]
    dica_cardapio: "Pico do inverno. Sopas, gratinados, pratos com molho. Inverno é ouro para CMV de folhosas"

  agosto:
    comprar: ["Cenoura", "Batata", "Brócolis", "Couve-flor", "Laranja", "Morango"]
    evitar: ["Cebola", "Limão", "Manga", "Abobrinha"]
    dica_cardapio: "Transição inverno-primavera. Manter pratos quentes. Limão caro — oferecer suco de laranja"

  setembro:
    comprar: ["Cenoura", "Batata", "Pimentão", "Vagem", "Laranja", "Morango"]
    evitar: ["Limão", "Maracujá", "Chuchu"]
    dica_cardapio: "Primavera. Reintroduzir saladas coloridas. Pimentão em safra — usar em refogados"

  outubro:
    comprar: ["Cebola", "Pimentão", "Vagem", "Abobrinha", "Melancia", "Mamão", "Morango"]
    evitar: ["Limão", "Maracujá", "Brócolis (começa a subir)"]
    dica_cardapio: "Variedade de legumes. Frutas tropicais voltando. Sorvetes e sobremesas geladas"

  novembro:
    comprar: ["Cebola", "Mamão", "Manga", "Abacaxi", "Abobrinha", "Berinjela", "Uva"]
    evitar: ["Brócolis", "Couve-flor", "Morango", "Chuchu"]
    dica_cardapio: "Verão se aproxima. Frutas tropicais abundantes para sucos. Saladas tropicais"

  dezembro:
    comprar: ["Cebola", "Manga", "Melancia", "Abacaxi", "Uva", "Milho"]
    evitar: ["Alface", "Rúcula", "Brócolis", "Couve-flor", "Morango"]
    dica_cardapio: "Festas. Demanda alta. Proteínas em alta (Chester, pernil). Frutas para sobremesas festivas"

# =============================================================================
# ESTRATÉGIAS DE SUBSTITUIÇÃO SAZONAL
# =============================================================================
substituicoes:
  - quando: "Tomate caro (dez-mar)"
    substituir: "Tomate fresco para molhos"
    por: "Tomate pelado em lata (Pomodori pelati) ou extrato de tomate"
    economia: "30-50%"

  - quando: "Brócolis caro (dez-fev)"
    substituir: "Brócolis fresco"
    por: "Vagem, couve-flor (se mais barata), ou brócolis congelado"
    economia: "20-40%"

  - quando: "Alface cara (dez-fev)"
    substituir: "Alface crespa/americana"
    por: "Repolho ralado, salada de cenoura, pepino ou acelga"
    economia: "40-60%"

  - quando: "Limão caro (ago-out)"
    substituir: "Limão fresco"
    por: "Polpa de limão congelada, vinagre, ou suco de maracujá"
    economia: "50-70%"

  - quando: "Morango caro (dez-mar)"
    substituir: "Morango fresco para sobremesas"
    por: "Manga fresca (em safra), banana caramelizada, ou morango congelado"
    economia: "60-80%"

  - quando: "Cebola cara (jun-ago)"
    substituir: "Cebola branca"
    por: "Alho-poró (se mais barato), cebolinha, ou cebola desidratada para bases"
    economia: "10-30%"

  - quando: "Pimentão caro (mai-jul)"
    substituir: "Pimentão vermelho/amarelo"
    por: "Pimentão verde (sempre mais barato) ou tomate para cor"
    economia: "40-60%"

# =============================================================================
# REGRA DE OURO: CARDÁPIO ROTATIVO SAZONAL
# =============================================================================
# Restaurantes que adaptam o cardápio à sazonalidade do hortifrúti
# economizam entre 15% e 30% no CMV de vegetais e frutas.
#
# Para um restaurante com CMV de R$ 35.000/mês, onde hortifrúti
# representa ~20% do CMV (R$ 7.000), a economia pode chegar a
# R$ 1.050 a R$ 2.100 por mês — ou R$ 12.600 a R$ 25.200 por ano.
#
# IMPLEMENTAÇÃO PRÁTICA:
# 1. Todo domingo: consultar preços da CEASA da semana
# 2. Montar cardápio da semana priorizando itens em safra
# 3. Manter 3-4 pratos fixos (clássicos) e 2-3 rotativos (sazonais)
# 4. No buffet: trocar 2-3 preparações de legumes conforme sazonalidade
# 5. Treinar equipe: "hoje não tem brócolis, tem vagem" é normal
