# Template de Calibração Semanal — Inventário Físico Curva A
# Preencher toda segunda-feira de manhã (antes de receber mercadorias)
# Tempo estimado: 30-45 minutos
# Referência: Abrasel, ABERC, NRA — Inventário Periódico Semanal

metadata:
  data: "{{YYYY-MM-DD}}"
  tipo: "semanal"
  curva: "A"
  responsavel: "{{NOME}}"
  hora_inicio: "{{HH:MM}}"
  hora_fim: "{{HH:MM}}"
  nota: "Contagem CEGA — não consultar posicao-atual.yaml antes de contar"

# ═══════════════════════════════════════════════════
# INSTRUÇÕES:
# 1. Pese cada item SEM consultar o saldo do sistema
# 2. Anote o peso real na coluna "saldo_real"
# 3. O agente @controlador-estoque preencherá as demais colunas
# ═══════════════════════════════════════════════════

