name: cfo-restaurante
version: 2.0.0
description: |
  Squad CFO — Gestão Financeira, Logística e Estratégica.
  Agente Master (Gerente Geral): Orquestração e Estratégia.
  Agente 1 (Arquiteto Lucro): Fichas Técnicas, Precificação, Cardápio.
  Agente 2 (Financeiro): DRE, CMV, Relatórios, Projeções, Impostos.
  Agente 3 (Estoque): Entradas, Saídas, Inventário.
  Agente 4 (Vendas): Revenue Management, Marketing, Campanhas.
  Regime: Simples Nacional.
